<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="nav-container">
            <div class="logo">
                <img src="./image/logo-big.svg" alt="logo-big">
            </div>
            <nav class="nav-menu">
                <a href="#menu1" class="nav-link">MENU1</a>
                <a href="#menu2" class="nav-link">MENU2</a>
                <a href="#menu3" class="nav-link">MENU3</a>
            </nav>
        </div>
    </header>

    <section class="hero-web">----------HERO WEB----------
        <h1>Main Title</h1>
    </section>

    <section class="home-content">----------HOME CONTENTS----------
        <div class="home-content-title">
            <h2>Highlights</h2>
            <p>Lorem, ipsum dolor sit amet consectetur
                adipisicing elit. Quisquam explicabo suscipit perspiciatis</p>
        </div>

        <div class="home-content-slider">
            <p>Home Content Slider</p>

            <!-- Slider von Module 5 -->
            <div class="slider_a">
                <input type="radio" name="slider" value="one" checked>
                <input type="radio" name="slider" value="two">
                <input type="radio" name="slider" value="three">

                <div class="slider_a_wrapper">
                    <div class="slider_a_element element_one"></div>
                    <div class="slider_a_element element_two"></div>
                    <div class="slider_a_element element_three"></div>
                </div>
            </div>
        </div>


        <div class="home-content-faq">Home Content FAQ</div>
    </section>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-links-left">Footer Links Left</div>
            <div class="footer-links-right">Footer Links Right</div>
        </div>
    </footer>
</body>

</html>
