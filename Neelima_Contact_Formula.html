<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact form</title>
    <link rel="stylesheet" href="./Neelima_Contact_Formula.css">

</head>

<body>

    <section class="Contact_form">
        <div class="Contact_row">

            <img src="./Icons/person_pin.png" alt="person_pin">
            <h1 class="Heading">Contact form</h1>
        </div>

        <div class="sub_lines">
            <p>Have a question or an idea to collaborate?</p>
            <p>in touch—I'd love to hear from you and explore how we can work together.</p>

        </div>


        <div class="questions-container">
            <div class="question-row">
                <div class="field">
                    <label>What's your name?</label>
                    <input type="text">
                </div>
                <div class="field">
                    <label>What's your email?</label>
                    <input type="email">
                </div>
            </div>

            <div class="field">
                <label>How can I help?</label>
                <input type="text">
            </div>
        </div>
    </section>


    <div class="bottom-section">
        <!-- Checkbox Row -->
        <div class="privacy-container">
            <input type="checkbox" id="privacy">
            <label for="privacy">
                I've read the <a href="#">privacy policy</a> and agree to the processing of my data as outlined.
            </label>
        </div>

        <img src="./Icons/Send button.png" alt="Send_button">
</body>

</html>
